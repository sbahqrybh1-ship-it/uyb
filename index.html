 const colRef=path=>({

   async set(o){const r=await sb.from("docs").upsert({coll:path,id,data:o});if(r.error)throw r.error},

 const LOCAL=CFG.url.startsWith("PUT"),SEEDC=new Set(["lessons","questions","extras","exams","examq"]);
 window.__LOCAL=LOCAL;
 if(LOCAL){
  const SEED={"lessons":{"lit-1":{"title":"أفعال المقاربة والرجاء والشروع","branch":"lit","rule":"أفعال المقاربة والرجاء والشروع أفعال ناسخة ناقصة، تدخل على الجملة الاسمية فترفع المبتدأ ويسمى اسمها، وتنصب الخبر ويسمى خبرها.\n• المقاربة (قرب وقوع الخبر): كاد، كرب، أوشك.\n• الرجاء (رجاء وقوع الخبر): عسى، حرى، اخلولق.\n• الشروع (بدء وقوع الخبر): شرع، بدأ، أخذ، جعل، طفق، قام.\nاسمها يأتي بعدها مباشرة مرفوعًا، وخبرها جملة فعلية فعلها مضارع. إن سبق المضارع بـ«أن» فهو منصوب وتعرب «أن والفعل» مصدرًا مؤولًا في محل نصب خبرًا، وإلا فالجملة الفعلية في محل نصب خبر.\nاقتران الخبر بـ«أن»: كاد وكرب: جائز بقلة. عسى وأوشك: جائز بكثرة. حرى واخلولق: واجب. أفعال الشروع: ممتنع.\nللتحقق من الفعل: تأكد من دلالته (مقاربة أو رجاء أو شروع) ومن أن خبره مضارع يبدأ بأحد حروف المضارعة.","remember":"اسمها مرفوع بعدها مباشرة، وخبرها مضارع؛ و«أن» جائزة مع كاد وكرب بقلة، ومع عسى وأوشك بكثرة، وواجبة مع حرى واخلولق، وممتنعة مع الشروع.","published":true,"order":1},"lit-2":{"title":"أدوات الشرط الجازمة","branch":"lit","rule":"أدوات الشرط الجازمة تربط جملتين: جملة فعل الشرط وجملة جواب الشرط، وتجزم الفعلين بعدها.\n• حروف: إن، إذما. • أسماء: من (للعاقل)، ما ومهما (لغير العاقل)، متى (للزمان)، أين وأينما (للمكان)، كيفما (للحال).\nعلامات جزم المضارع: السكون في الصحيح الآخر، وحذف حرف العلة في المعتل الآخر، وحذف النون في الأفعال الخمسة. وإن كان فعل الشرط أو جوابه ماضيًا فهو مبني في محل جزم.\nيقترن الجواب بالفاء وجوبًا إذا كان: جملة اسمية، أو جملة فعلية طلبية (أمر أو نهي أو استفهام)، أو فعلها جامد (عسى، ليس، نعم، بئس)، أو مسبوقة بـ (قد، لن، ما، سوف، السين).\nللتحقق من أن الجملة شرطية: ابحث عن الأداة وفعل الشرط وجوابه، وعلامات الجزم، والفاء.","remember":"الأداة + فعل الشرط + جواب الشرط، والفعلان مجزومان، ويقترن الجواب بالفاء في مواضع محددة.","published":true,"order":2},"lit-3":{"title":"أدوات الشرط غير الجازمة","branch":"lit","rule":"أدوات الشرط غير الجازمة تربط بين فعلين أو جملتين لبيان السبب والنتيجة، ولا تغيّر علامات الإعراب في الأفعال بعدها.\n• لو: حرف امتناع لامتناع، فعلها وجوابها ماضيان، ويجوز اقتران جوابها باللام.\n• لولا: حرف امتناع لوجود، يليه اسم يعرب مبتدأ خبره محذوف وجوبًا، وجوابها ماضٍ يقترن باللام إن كان مثبتًا.\n• إذا: ظرف للزمان المستقبل في محل نصب مفعول فيه؛ فإن جاء بعدها اسم فهو فاعل لفعل محذوف إذا كان الفعل بعده مبنيًّا للمعلوم، ونائب فاعل إذا كان مبنيًّا للمجهول.\n• كلما: ظرف للزمان الماضي يفيد التكرار، وفعلها وجوابها ماضيان.\nإعراب لو ولولا: حرف شرط غير جازم مبني على السكون لا محل له من الإعراب.","remember":"لو: امتناع لامتناع. لولا: امتناع لوجود. إذا: ظرف للمستقبل. كلما: ظرف للماضي يفيد التكرار.","published":true,"order":3},"lit-4":{"title":"أحوال المبتدأ والخبر","branch":"lit","rule":"المبتدأ: اسم ظاهر (محمد مبدع)، أو ضمير منفصل (أنت مبدع)، أو مصدر مؤول (أن تدرس خير لك).\nالخبر: مفرد (الطالبان متفوقان)، أو جملة اسمية (محمد خلقه جميل)، أو جملة فعلية (محمد يأكل)، أو شبه جملة (محمد في البيت).\nيتقدم الخبر وجوبًا في ثلاث حالات: إذا كان المبتدأ نكرة والخبر شبه جملة، أو اشتمل المبتدأ على ضمير يعود على الخبر، أو كان الخبر محصورًا بـ«إلا».\nيحذف المبتدأ إذا دلّ عليه جواب القسم، أو كان الخبر مصدرًا نائبًا عن فعله (صبر جميل).\nيحذف الخبر وجوبًا إذا سُبق المبتدأ بـ«لولا» (لولا الشمس لعمّ الظلام).","remember":"صور المبتدأ: اسم ظاهر أو ضمير منفصل أو مصدر مؤول. صور الخبر: مفرد أو جملة (اسمية/فعلية) أو شبه جملة. ويحذف الخبر وجوبًا بعد «لولا».","published":true,"order":4},"lit-5":{"title":"المصدر المؤول","branch":"lit","rule":"صور المصدر المؤول: أن + الفعل المضارع (سرّني أن تدرس)، أو أن + اسمها وخبرها (سرّني أنك مجتهد)، أو ما + الفعل (سرّني ما قلت).\nإعرابه بحسب موقعه: مبتدأ إن جاء في أول الجملة (أن تدرس خير لك)، واسم مجرور إن سُبق بحرف جر (علمت بأنك صادق)، وفاعل (سرّني أن تدرس)، ومفعول به (أحب أن تدرس).\nللتعرف عليه ابحث عن «أن» التي همزتها على الألف، فإن لم تجدها فابحث عن «ما» المصدرية غير النافية وغير التعجبية.","remember":"المصدر المؤول: أن/ما المصدرية مع ما بعدها، ويعرب بحسب موقعه في الجملة.","published":true,"order":5},"lit-6":{"title":"المصدر الميمي","branch":"lit","rule":"المصدر الميمي مصدر يبدأ بميم زائدة.\nمن الفعل الثلاثي: على وزن «مَفعَل» (سعى — مَسعى)، فإن كان أوله واوًا فعلى وزن «مَفعِل» (وعد — مَوعِد).\nمن غير الثلاثي: نأتي بمضارعه، ثم نبدل حرف المضارعة ميمًا مضمومة ونفتح ما قبل الآخر (ينتظر — مُنتظَر).\nقد تضاف إليه تاء مربوطة (محبّة، معصية).\nيشترك مع اسم الزمان واسم المكان واسم المفعول في الصيغة، ويُفرَّق بينها بالسياق والدلالة.","remember":"المصدر الميمي يدل على الحدث نفسه، لا على الزمان ولا المكان ولا من وقع عليه الفعل.","published":true,"order":6},"sci-1":{"title":"أفعال المقاربة والرجاء والشروع","branch":"sci","rule":"أفعال المقاربة والرجاء والشروع أفعال ناسخة ناقصة، تدخل على الجملة الاسمية فترفع المبتدأ ويسمى اسمها، وتنصب الخبر ويسمى خبرها.\n• المقاربة (قرب وقوع الخبر): كاد، كرب، أوشك.\n• الرجاء (رجاء وقوع الخبر): عسى، حرى، اخلولق.\n• الشروع (بدء وقوع الخبر): شرع، بدأ، أخذ، جعل، طفق، قام.\nاسمها يأتي بعدها مباشرة مرفوعًا، وخبرها جملة فعلية فعلها مضارع. إن سبق المضارع بـ«أن» فهو منصوب وتعرب «أن والفعل» مصدرًا مؤولًا في محل نصب خبرًا، وإلا فالجملة الفعلية في محل نصب خبر.\nاقتران الخبر بـ«أن»: كاد وكرب: جائز بقلة. عسى وأوشك: جائز بكثرة. حرى واخلولق: واجب. أفعال الشروع: ممتنع.\nللتحقق من الفعل: تأكد من دلالته (مقاربة أو رجاء أو شروع) ومن أن خبره مضارع يبدأ بأحد حروف المضارعة.","remember":"اسمها مرفوع بعدها مباشرة، وخبرها مضارع؛ و«أن» جائزة مع كاد وكرب بقلة، ومع عسى وأوشك بكثرة، وواجبة مع حرى واخلولق، وممتنعة مع الشروع.","published":true,"order":1},"sci-2":{"title":"أدوات الشرط الجازمة","branch":"sci","rule":"أدوات الشرط الجازمة تربط جملتين: جملة فعل الشرط وجملة جواب الشرط، وتجزم الفعلين بعدها.\n• حروف: إن، إذما. • أسماء: من (للعاقل)، ما ومهما (لغير العاقل)، متى (للزمان)، أين وأينما (للمكان)، كيفما (للحال).\nعلامات جزم المضارع: السكون في الصحيح الآخر، وحذف حرف العلة في المعتل الآخر، وحذف النون في الأفعال الخمسة. وإن كان فعل الشرط أو جوابه ماضيًا فهو مبني في محل جزم.\nيقترن الجواب بالفاء وجوبًا إذا كان: جملة اسمية، أو جملة فعلية طلبية (أمر أو نهي أو استفهام)، أو فعلها جامد (عسى، ليس، نعم، بئس)، أو مسبوقة بـ (قد، لن، ما، سوف، السين).\nللتحقق من أن الجملة شرطية: ابحث عن الأداة وفعل الشرط وجوابه، وعلامات الجزم، والفاء.","remember":"الأداة + فعل الشرط + جواب الشرط، والفعلان مجزومان، ويقترن الجواب بالفاء في مواضع محددة.","published":true,"order":2},"sci-3":{"title":"أدوات الشرط غير الجازمة","branch":"sci","rule":"أدوات الشرط غير الجازمة تربط بين فعلين أو جملتين لبيان السبب والنتيجة، ولا تغيّر علامات الإعراب في الأفعال بعدها.\n• لو: حرف امتناع لامتناع، فعلها وجوابها ماضيان، ويجوز اقتران جوابها باللام.\n• لولا: حرف امتناع لوجود، يليه اسم يعرب مبتدأ خبره محذوف وجوبًا، وجوابها ماضٍ يقترن باللام إن كان مثبتًا.\n• إذا: ظرف للزمان المستقبل في محل نصب مفعول فيه؛ فإن جاء بعدها اسم فهو فاعل لفعل محذوف إذا كان الفعل بعده مبنيًّا للمعلوم، ونائب فاعل إذا كان مبنيًّا للمجهول.\n• كلما: ظرف للزمان الماضي يفيد التكرار، وفعلها وجوابها ماضيان.\nإعراب لو ولولا: حرف شرط غير جازم مبني على السكون لا محل له من الإعراب.","remember":"لو: امتناع لامتناع. لولا: امتناع لوجود. إذا: ظرف للمستقبل. كلما: ظرف للماضي يفيد التكرار.","published":true,"order":3}},"questions":{"lit-1-q01":{"lessonId":"lit-1","text":"أيُّ الآيات الآتية اشتملت على فعل من أفعال المقاربة؟","options":["﴿إِنَّهُمْ يَكِيدُونَ كَيْدًا﴾","﴿كَذَلِكَ كِدْنَا لِيُوسُفَ﴾","﴿وَتَاللَّهِ لَأَكِيدَنَّ أَصْنَامَكُمْ﴾","﴿يَكَادُ سَنَا بَرْقِهِ يَذْهَبُ بِالْأَبْصَارِ﴾"],"correct":3,"why":"في الآية الرابعة «يكاد» فعل مقاربة ناقص، اسمه «سنا»، وخبره الجملة الفعلية «يذهب». أما الآيات الأخرى ففيها الفعل «كاد/يكيد» بمعنى المكر والتدبير، فهو فعل تام لا يدل على قرب وقوع الخبر.","level":"easy","skill":"تمييز أفعال المقاربة","extra":false,"published":true,"order":1},"lit-1-q02":{"lessonId":"lit-1","text":"أيُّ الجمل الآتية اشتملت على فعل من أفعال المقاربة؟","options":["كَرَبَ المطرُ أن يتوقّف.","كَرَبَ خالدًا فُراقُ أصحابِه.","كَرَبَ الصيّادُ حبلَ السّفينة.","كرَبَ الفلّاحُ الأرضَ؛ ليزرعها."],"correct":0,"why":"«كرب» في الجملة الأولى بمعنى «قارب»، واسمها «المطر» وخبرها «أن يتوقف». وفي الجمل الأخرى فعل تام متعدٍّ له مفعول به، بمعنى أحزن أو فتل أو قلب الأرض، فلا يدل على المقاربة.","level":"mid","skill":"تمييز أفعال المقاربة","extra":false,"published":true,"order":2},"lit-1-q03":{"lessonId":"lit-1","text":"أيُّ الجمل الآتية اشتملت على فعل من أفعال الشروع؟","options":["أخذ الطبيب عينة من الدم؛ لفحصها.","أخذ الطفل بثوب أمه من شدة الخوف.","أخذ الطالب يذاكر دروس اللغة العربية.","أخذ اللاعبون قسطًا من الراحة بعد المباراة."],"correct":2,"why":"في الجملة الثالثة «أخذ» بمعنى «بدأ»، واسمه «الطالب» وخبره الجملة المضارعة «يذاكر». أما في الجمل الأخرى فهو فعل تام بمعنى تناول أو تمسّك، وبعده مفعول به أو جار ومجرور وليس فعلًا مضارعًا خبرًا.","level":"easy","skill":"تمييز أفعال الشروع","extra":false,"published":true,"order":3},"lit-1-q04":{"lessonId":"lit-1","text":"أيُّ الجمل الآتية اشتملت على فعل من أفعال الشروع؟","options":["شرع الحاكم قانونًا جديدًا.","شرع العلماء مبادئ العقيدة.","شرع القاضي يدرس القضية.","شرع الصياد السهم تجاه الطريدة."],"correct":2,"why":"«شرع» في الجملة الثالثة بمعنى «بدأ»، وخبره الجملة المضارعة «يدرس». وفي غيرها بمعنى سنّ أو وضع أو وجّه، وبعده مفعول به.","level":"mid","skill":"تمييز أفعال الشروع","extra":false,"published":true,"order":4},"lit-1-q05":{"lessonId":"lit-1","text":"أيُّ الأبيات الآتية تضمن فعلًا ناقصًا دالًّا على الرجاء؟","options":["كَرَبَ القلبُ من جواه يذوبُ حين قال الوشاةُ هندٌ غضوبُ","هببتُ ألومُ القلبَ في طاعةِ الهوى فلجَّ كأنّني كنتُ باللومِ مُغريا","فأخذتُ أسألُ والرسومُ تجيبني وفي الاعتبارِ إجابةٌ وسؤالُ","إن تلقَ من بني عبد شمسٍ فحرى أن يكونَ ذاك وكانا"],"correct":3,"why":"الفعل «حرى» من أفعال الرجاء، وخبره «أن يكون». أما «كرب» ففعل مقاربة، و«أخذت» فعل شروع.","level":"mid","skill":"تمييز أفعال الرجاء","extra":false,"published":true,"order":5},"lit-1-q06":{"lessonId":"lit-1","text":"ما حكم اقتران «أنْ» بخبر (عسى) في الآية الآتية؟ ﴿فَأُولَئِكَ عَسَى اللَّهُ أَنْ يَعْفُوَ عَنْهُمْ﴾","options":["واجب.","ممتنع.","جائز، ولكنه قليل.","جائز، ولكنه كثير."],"correct":3,"why":"الأصل في خبر «عسى» أنه جائز الاقتران بـ«أن» بكثرة، وقد اقترن هنا بها في «أن يعفو».","level":"easy","skill":"حكم اقتران الخبر بأن","extra":false,"published":true,"order":6},"lit-1-q07":{"lessonId":"lit-1","text":"ما حكم اقتران «أنْ» بخبر (كرب) في البيت الآتي؟ كَرَبَ القلبُ من جواه يذوبُ","options":["واجب.","ممتنع.","جائز، ولكنه قليل.","جائز، ولكنه كثير."],"correct":2,"why":"يجوز اقتران خبر «كاد وكرب» بـ«أن» لكن بقلة، وجاء الخبر «يذوب» هنا خاليًا منها.","level":"easy","skill":"حكم اقتران الخبر بأن","extra":false,"published":true,"order":7},"lit-1-q08":{"lessonId":"lit-1","text":"أيُّ الجمل الآتية جاء فيها حكم اقتران خبر الفعل الناسخ بـ«أنْ» واجبًا؟","options":["اخلولق المطرُ أن ينزلَ.","عسى المعلمُ أن يعيدَ الدرس.","كرب اللاعبُ أن يفوزَ بالجائزة.","أوشك الطالبُ أن يفوزَ بالجائزة الأولى."],"correct":0,"why":"«اخلولق» من الأفعال التي يجب اقتران خبرها بـ«أن». وأما عسى وأوشك فيجوز بكثرة، وكرب يجوز بقلة.","level":"mid","skill":"حكم اقتران الخبر بأن","extra":false,"published":true,"order":8},"lit-1-q09":{"lessonId":"lit-1","text":"أيُّ الجمل الآتية جاء فيها حكم اقتران خبر الفعل الناسخ بـ«أنْ» واجبًا؟","options":["يوشك المطرُ أن ينهمر.","حرى الفرجُ أن يكونَ قريبًا.","كاد المعلمُ أن يكونَ رسولًا.","عسى اللهُ أن يغفرَ لي ذنوبي."],"correct":1,"why":"«حرى» يجب اقتران خبرها بـ«أن». أما يوشك وعسى فجائز بكثرة، وكاد جائز بقلة.","level":"mid","skill":"حكم اقتران الخبر بأن","extra":false,"published":true,"order":9},"lit-1-q10":{"lessonId":"lit-1","text":"أيُّ الجمل الآتية جاء فيها حكم اقتران خبر الفعل الناسخ بـ«أنْ» ممتنعًا؟","options":["عسى الكربُ ينفرج.","يوشك الامتحانُ يبدأ.","شرع الطالبُ يقرأ الدرس.","يكاد المطرُ يغرق المكان."],"correct":2,"why":"«شرع» من أفعال الشروع، وخبر أفعال الشروع يمتنع اقترانه بـ«أن».","level":"mid","skill":"حكم اقتران الخبر بأن","extra":false,"published":true,"order":10},"lit-1-q11":{"lessonId":"lit-1","text":"﴿وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ﴾ — أيُّ مما يأتي اسم الفعل الناقص «طفق» في الآية السابقة؟","options":["ورق.","الجنة.","يخصفان.","الألف في طفقا."],"correct":3,"why":"اسم «طفق» لم يأتِ اسمًا ظاهرًا بعده، فجاء ضميرًا متصلًا هو ألف الاثنين في «طفقا». و«يخصفان» خبره.","level":"mid","skill":"تحديد اسم الفعل الناسخ","extra":false,"published":true,"order":11},"lit-1-q12":{"lessonId":"lit-1","text":"﴿تَكَادُ السَّمَاوَاتُ يَتَفَطَّرْنَ مِنْهُ وَتَنْشَقُّ الْأَرْضُ﴾ — ما إعراب الكلمة التي تحتها خط (السماوات)؟","options":["فاعل مرفوع وعلامة رفعه الضمة.","اسم تكاد مرفوع وعلامة رفعه الضمة.","خبر لمبتدأ محذوف مرفوع وعلامة رفعه الضمة.","خبر تكاد منصوب."],"correct":1,"why":"«تكاد» فعل مقاربة ناقص، والاسم الذي يليه مباشرة مرفوع على أنه اسمه، وخبره جملة «يتفطرن».","level":"mid","skill":"إعراب اسم الفعل الناسخ","extra":false,"published":true,"order":12},"lit-1-q13":{"lessonId":"lit-1","text":"«حرى الغمامة ..........» — أيُّ مما يأتي يملأ الفراغ؟","options":["منكشفة.","منكشفةً.","تنكشف.","أن تنكشف."],"correct":3,"why":"«حرى» يجب اقتران خبرها بـ«أن»، فيكون الخبر مصدرًا مؤولًا من «أن تنكشف».","level":"hard","skill":"حكم اقتران الخبر بأن","extra":false,"published":true,"order":13},"lit-1-q14":{"lessonId":"lit-1","text":"«بدأ كل معلم .......... واجبات طلابه» — أيُّ مما يأتي يملأ الفراغ؟","options":["يتابعُ.","متابعٌ.","متابعًا.","أن يتابعَ."],"correct":0,"why":"«بدأ» من أفعال الشروع، وخبرها جملة فعلها مضارع، ويمتنع اقترانه بـ«أن»، فيكون الصواب «يتابع».","level":"mid","skill":"خبر أفعال الشروع","extra":false,"published":true,"order":14},"lit-2-q01":{"lessonId":"lit-2","text":"أيُّ الأبيات الآتية تضمَّنَ أسلوبَ شرطٍ؟","options":["مَن ذا الذي يحمل شجوَ الهوى مَن ذا الذي يجرعُ مُرَّ القضا","تلفتُّ أينَ الروضُ أينَ مكانُه وأينَ مجاليه وأينَ بواكره","متى رضينا مثلَ هذي الحال متى مددنا الكفَّ للسؤال","أنا ابنُ جلا وطلّاعُ الثنايا متى أضعِ العمامةَ تعرفوني"],"correct":3,"why":"«متى» هنا شرطية: فعل الشرط «أضع» وجوابه «تعرفوني» مجزومان. أما «من ذا» و«أين» و«متى مددنا» فللاستفهام ولا جواب فيها.","level":"easy","skill":"أسلوب الشرط","extra":false,"published":true,"order":1},"lit-2-q02":{"lessonId":"lit-2","text":"أيُّ الأبيات الآتية تضمَّنَ أداةَ شرطٍ جازمةً؟","options":["ما أجملَ الصلاحَ منكم خلةً ما أبشعَ الظلامَ منكم فعلةً","رأيتك تنجز ما لم تعد وفاءً وتفعل ما لم تقل","ما تفعلُ النفسُ النفيسةُ عندما تتهاجرُ الأرواحُ والأجسادُ","ما يشأْ ربُّك يف "إعراب المصدر المؤول","extra":false,"published":true,"order":12},"lit-6-q01":{"lessonId":"lit-6","text":"أيُّ الآيات الآتية اشتملت على مصدر ميمي؟","options":["﴿وَذَرْنِي وَالْمُكَذِّبِينَ أُولِي النَّعْمَةِ وَمَهِّلْهُمْ قَلِيلًا﴾","﴿حَتَّى إِذَا أَخَذْنَا مُتْرَفِيهِم بِالْعَذَابِ إِذَا هُمْ يَجْأَرُونَ﴾","﴿زُيِّنَ لِلنَّاسِ حُبُّ الشَّهَوَاتِ مِنَ النِّسَاءِ وَالْبَنِينَ وَالْقَنَاطِيرِ الْمُقَنطَرَةِ﴾","﴿إِذَا تَنَاجَيْتُمْ فَلَا تَتَنَاجَوْا بِالْإِثْمِ وَالْعُدْوَانِ وَمَعْصِيَةِ الرَّسُولِ﴾"],"correct":3,"why":"«معصية» مصدر ميمي بمعنى عصيان. أما «المكذبين» و«مترفيهم» و«المقنطرة» فأسماء مفعول، و«مهّلهم» فعل.","level":"mid","skill":"المصدر الميمي","extra":false,"published":true,"order":1},"lit-6-q02":{"lessonId":"lit-6","text":"أيُّ الآيات الآتية اشتملت على مصدر ميمي؟","options":["﴿كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِّيَدَّبَّرُوا آيَاتِهِ﴾","﴿مُّذَبْذَبِينَ بَيْنَ ذَلِكَ لَا إِلَى هَؤُلَاءِ وَلَا إِلَى هَؤُلَاءِ﴾","﴿وَمِنْ آيَاتِهِ مَنَامُكُم بِاللَّيْلِ وَالنَّهَارِ وَابْتِغَاؤُكُم مِّن فَضْلِهِ﴾","﴿قَالَ رَبِّ فَأَنظِرْنِي إِلَى يَوْمِ يُبْعَثُونَ قَالَ فَإِنَّكَ مِنَ الْمُنظَرِينَ﴾"],"correct":2,"why":"«منامكم» مصدر ميمي بمعنى نومكم. والباقي أسماء مفعول: مبارك، مذبذبين، المنظرين.","level":"mid","skill":"المصدر الميمي","extra":false,"published":true,"order":2},"lit-6-q03":{"lessonId":"lit-6","text":"أيُّ الآيات الآتية اشتملت على مصدر ميمي؟","options":["﴿قَالُوا يَا صَالِحُ قَدْ كُنتَ فِينَا مَرْجُوًّا قَبْلَ هَذَا﴾","﴿وَالْمُحْصَنَاتُ مِنَ النِّسَاءِ إِلَّا مَا مَلَكَتْ أَيْمَانُكُمْ﴾","﴿وَمَن تَابَ وَعَمِلَ صَالِحًا فَإِنَّهُ يَتُوبُ إِلَى اللَّهِ مَتَابًا﴾","﴿فَهِيَ خَاوِيَةٌ عَلَى عُرُوشِهَا وَبِئْرٍ مُّعَطَّلَةٍ وَقَصْرٍ مَّشِيدٍ﴾"],"correct":2,"why":"«متابًا» مصدر ميمي بمعنى توبة. أما «مرجوًّا» و«المحصنات» و«مشيد» فأسماء مفعول.","level":"mid","skill":"المصدر الميمي","extra":false,"published":true,"order":3},"lit-6-q04":{"lessonId":"lit-6","text":"أيُّ الآيات الآتية اشتملت على مصدر ميمي؟","options":["﴿إِنَّهُ كَانَ وَعْدُهُ مَأْتِيًّا﴾","﴿ارْجِعِي إ   const loadContent=async()=>{if(CONTENT)return CONTENT;let base=null;
   if(ADM()){try{const v=localStorage.getItem("isbah:content");if(v)base=JSON.parse(v)}catch(e){}}
   if(!base){try{const r=await fetch("content.json?v="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.lessons&&j.questions)base=j}}catch(e){}}
   CONTENT=base||JSON.parse(JSON.stringify(SEED));return CONTENT};
  const saveContent=()=>{try{localStorage.setItem("isbah:content",JSON.stringify(CONTENT))}catch(e){throw Error("تعذّر حفظ التعديل: مساحة المتصفح ممتلئة.")}};
  const lc=path=>{const C=SEEDC.has(path),pp=()=>(ADM()?"A:":"")+path;return{
   async get(){const m=C?((await loadContent())[path]||{}):lsGet(pp());return{docs:Object.entries(m).map(([id,d])=>snap(id,d))}},
   doc(id){return{
    async get(){const m=C?((await loadContent())[path]||{}):lsGet(pp());return snap(id,m[id])},
    async set(o){if(C){if(!ADM())ro();const c=await loadContent();(c[path]=c[path]||{})[id]=o;saveContent()}else{const m=lsGet(pp());m[id]=o;lsSet(pp(),m)}},
    async update(o){if(C){if(!ADM())ro();const c=await loadContent();(c[path]=c[path]||{});c[path][id]={...(c[path][id]||{}),...o};saveContent()}else{const m=lsGet(pp());m[id]={...(m[id]||{}),...o};lsSet(pp(),m)}},
    async delete(){if(C){if(!ADM())ro();const c=await loadContent();if(c[path])delete c[path][id];saveContent()}else{const m=lsGet(pp());delete m[id];lsSet(pp(),m)}}}},
   async add(o){const id=crypto.randomUUID();await this.doc(id).set(o);return{id}}}};
  let luid=null;try{luid=localStorage.getItem("isbah:uid")}catch(e){}
  if(!luid){luid=crypto.randomUUID();try{localStorage.setItem("isbah:uid",luid)}catch(e){}}
  window.claude={async use(n){if(n==="db")return{collection:lc};if(n==="user")return{id:async()=>luid,isOwner:()=>ADM()}}};
  return}
 let P=null;const once=()=>P||(P=ensure().catch(e=>{P=null;throw e}));
 window.claude={async use(n){await once();if(n==="db")return{collection:colRef};if(n==="user")return{id:async()=>_user.id,isOwner:()=>_admin}}};
})();
</script>
<script>
const $=s=>document.querySelector(s), A=$("#app");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const col=n=>db.collection(n);
const rows=async n=>(await col(n).get()).docs.map(d=>({id:d.id,...d.data()}));
async function load(){lessons=(await rows("lessons")).sort((a,b)=>(a.order||0)-(b.order||0));questions=(await rows("questions")).sort((a,b)=>(a.order||0)-(b.order||0));try{extras=await rows("extras")}catch(e){extras=[]}try{exams=await rows("exams");examq=await rows("examq")}catch(e){exams=[];examq=[]}
 try{const m=await col("students").doc(uid).get();me=m.data()||null}catch(e){me=null}}

 try{[db,user]=await Promise.all([claude.use("db"),claude.use("user")])}catch(e){}
 if(!db||!user){A.innerHTML='<div class="card"><div class="hero">'+LAMP+'<h1>الإصباح في اللغة العربية</h1></div><div class="msg">يتطلب فتح المنصة تسجيل الدخول عبر حساب Claude، ولا يمكن حفظ التقدم من دونه.</div></div>';return}
 uid=await user.id();owner=user.isOwner();
 try{await load()}catch(e){return fail(e)}

 render()}

/* ---------- الطالب ---------- */
function myAttempts(){return (S.att||[])}
async function home(){
 let h=head()+hero();
 if(!me||S.edit){h+='<div class="card"><h2>اسم الطالب</h2><input id="nm" placeholder="اكتب اسمك" maxlength="60" value="'+esc(me?me.name:"")+'"><h3>اختر الفرع الدراسي للمتابعة</h3><div class="row"><button class="btn o" id="b-sci">العلمي</button><button class="btn o" id="b-lit">الأدبي</button></div>'+(me?'<p><button class="btn o" id="cn">إلغاء والعودة</button></p>':'')+'<p style="color:var(--mut);font-size:14px">يُحفظ تقدمك على هذا الجهاز؛ فاستعمل الجهاز نفسه لمتابعة تدريبك.</p><div id="er"></div></div>';
  A.innerHTML=h;let br="";if($("#cn"))$("#cn").onclick=()=>go("home");
  ["sci","lit"].forEach(b=>$("#b-"+b).onclick=async()=>{br=b;const n=$("#nm").value.trim();
   if(n.length<2){$("#er").innerHTML='<div class="msg">أدخل اسمك أولًا.</div>';return}
   try{const old=me;me={name:n,branch:b,uid,createdAt:old?old.createdAt:Date.now(),lastActive:Date.now()};await col("students").doc(uid).set(me);S={v:"home"};render()}catch(e){fail(e)}});return}
 let att=[];try{att=(await col("attempts/"+uid+"/items").get()).docs.map(d=>d.data())}catch(e){}
 S.att=att;
 const ls=lessons.filter(l=>l.published&&l.branch===me.branch);
 h+='<div class="card"><b>أهلًا '+esc(me.name)+'</b> <span class="tag">'+BR[me.branch]+'</span><button class="btn o" style="float:left" id="chg">تغيير الفرع</button></div><h2>الدروس المتاحة</h2>';
 if(!ls.length)h+='<div class="card empty">لم يُنشر أي درس لفرعك بعد.</div>';
 ls.forEach(l=>{const a=att.filter(x=>x.lessonId===l.id&&x.kind==="mastery"),best=a.length?Math.max(...a.map(x=>x.pct)):null;
  h+='<div class="card"><h3>'+esc(l.title)+'</h3>'+seqTxt(att,l.id)+'<div style="margin-top:10px"><button class="btn" data-l="'+l.id+'">ادخل الدرس</button></div></div>'});
 A.innerHTML=h;
 A.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>go("lessonIntro",{lid:b.dataset.l}));
 $("#chg").onclick=()=>go("home",{edit:true});if($("#snd"))$("#snd").onclick=sendCode}
function seqTxt(att,lid){const a=att.filter(x=>x.lessonId===lid).sort((x,y)=>x.at-y.at);const f=a.filter(x=>!x.round&&x.kind!=="mastery")[0];if(!f)return '<span style="color:var(--mut)">لم تبدأ بعد</span>';const last=a[a.length-1].sid,s=a.filter(x=>x.sid===last);return '<div>علامتك في المحاولة الأولى: <b>'+f.score+'/'+f.total+'</b> ('+f.pct+'%)</div><div style="color:var(--mut)">تسلسل آخر محاولة: '+s.map(x=>(x.round?'علاج '+x.round:(x.kind==="mastery"?'إتقان':'الأولى'))+': '+x.score+'/'+x.total).join(' ← ')+'</div>'}
function lessonIntro(){const l=lessons.find(x=>x.id===S.lid);
 A.innerHTML=head()+'<div class="card"><span class="tag">'+BR[l.branch]+'</span><h2>'+esc(l.title)+'</h2><h3>القاعدة</h3><div style="white-space:pre-wrap">'+esc(l.rule||"لم يُضَف شرح لهذه القاعدة بعد.")+'</div>'+(l.remember?'<div class="fb ok"><b>تذكّر:</b> '+esc(l.remember)+'</div>':'')+'</div><div class="card"><h3>اختر المستوى</h3><div class="row"><button class="btn o" data-lv="all">كل المستويات</button><button class="btn o" data-lv="easy">سهل</button><button class="btn o" data-lv="mid">متوسط</button><button class="btn o" data-lv="hard">صعب</button></div></div>';
 A.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{
  let qs=questions.filter(q=>q.lessonId===l.id&&q.published&&(b.dataset.lv==="all"||q.level===b.dataset.lv));
  if(!qs.length){alert("لا توجد أسئلة منشورة بهذا المستوى.");return}
  go("quiz",{lid:l.id,qs,i:0,ans:[],kind:"practice"})})}
function quiz(){const q=S.qs[S.i],l=lessons.find(x=>x.id===S.lid);S.pick=null;S.done=false;
 A.innerHTML=head()+'<div class="card"><span class="tag">'+BR[l.branch]+'</span><span class="tag">'+esc(l.title)+'</span><span class="tag">'+LV[q.level]+'</span>'+(S.round?'<span class="tag">اختبر نفسك — جولة '+S.round+'</span>':'')+'<div style="margin:8px 0">سؤال '+(S.i+1)+' من '+S.qs.length+'</div><div class="bar"><i style="width:'+(S.i/S.qs.length*100)+'%"></i></div><h3 style="color:var(--tx)">'+esc(q.text)+'</h3><div id="os">'+q.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><button class="btn" id="chk" disabled>تحقّق من الإجابة</button><div id="fb" aria-live="polite"></div></div>';
 A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.done)return;S.pick=+b.dataset.i;A.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));$("#chk").disabled=false});
 $("#chk").onclick=()=>{if(S.done||S.pick===null)return;S.done=true;const ok=S.pick===q.correct;S.ans.push({qid:q.id,pick:S.pick,ok,skill:q.skill||"",level:q.level});
  A.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===q.correct)x.classList.add("ok");else if(i===S.pick)x.classList.add("no")});
  $("#fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"إجابة صحيحة، أحسنت!":"ليست هذه الإجابة الصحيحة، ولا بأس؛ لنتعرّف إلى السبب.")+'</b><br>الإجابة الصحيحة: '+esc(q.options[q.correct])+'<br>'+(q.why?esc(q.why):'<i>لم يُضَف تعليل لهذا السؤال.</i>')+'</div><button class="btn" id="nx" style="margin-top:10px">'+(S.i+1<S.qs.length?"السؤال التالي":"عرض التقرير")+'</button>';
  $("#chk").disabled=true;$("#nx").onclick=()=>{if(S.i+1<S.qs.length){S.i++;quiz()}else finish()}}}
async function finish(){const tot=S.ans.length,c=S.ans.filter(a=>a.ok).length,pct=Math.round(c/tot*100);
 const sk={};S.ans.forEach(a=>{const k=a.skill||"غير محددة";(sk[k]=sk[k]||[0,0]);sk[k][1]++;if(a.ok)sk[k][0]++});
 const sid=S.sid||String(Date.now()),rd=S.round||0;const rec={uid,lessonId:S.lid,kind:S.kind,score:c,total:tot,pct,skills:sk,answers:S.ans,at:Date.now(),sid,round:rd};
 let prev=null;try{prev=(await col("attempts/"+uid+"/items").get()).docs.map(d=>d.data()).filter(x=>x.lessonId===S.lid&&x.kind===S.kind).sort((a,b)=>b.at-a.at)[0]}catch(e){}
 try{await col("attempts/"+uid+"/items").add(rec);await col("students").doc(uid).update({lastActive:Date.now()})}catch(e){return fail(e)}
 go("report",{rec,prev,ans:S.ans,used:S.used||[]})}
function report(){const r=S.rec,p=S.prev,need=(window.MASTERY||90);
 const strong=[],weak=[];Object.entries(r.skills).forEach(([k,[c,t]])=>(c===t?strong:weak).push(k+" ("+c+"/"+t+")"));
 A.innerHTML=head()+'<div class="card"><h2>التقرير</h2><p>الدرجة: <b>'+r.score+' من '+r.total+'</b> ('+r.pct+'%) — صحيحة: '+r.score+'، خاطئة: '+(r.total-r.score)+'</p><h3>نقاط القوة</h3>'+(strong.length?'<ul>'+strong.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<p style="color:var(--mut)">لم تظهر بعد مهارة أُجيبت كلها إجابة صحيحة.</p>')+'<h3>ما يحتاج إلى مراجعة</h3>'+(weak.length?'<ul>'+weak.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><p>الخطة: راجع القاعدة، ثم أعد التدريب على هذه المهارات.</p>':'<p>لا أخطاء في هذه المحاولة.</p>')+'<h3>متابعة التحسن</h3><p>'+(p?'من '+p.pct+'% في المحاولة السابقة إلى '+r.pct+'% الآن.':'هذه أول محاولة مسجلة لك في هذا النوع من التدريب.')+'</p>'+(r.pct>=need?'<div class="fb ok">بلغت معيار الإتقان ('+need+'%) في هذه المجموعة. لم تُقيَّم المهارات غير المشمولة بها بعد.</div>':'<div class="fb no">لم تبلغ معيار الإتقان ('+need+'%) بعد؛ راجع القاعدة ثم حاول مجددًا.</div>')+'<div class="row" style="margin-top:12px"><button class="btn" id="rt">مراجعة القاعدة</button><button class="btn o" id="ms">اختبار إتقان</button></div></div>';
 $("#rt").onclick=()=>go("lessonIntro",{lid:r.lessonId});
 $("#ms").onclick=()=>{const qs=questions.filter(q=>q.lessonId===r.lessonId&&q.published);if(!qs.length)return alert("لا أسئلة.");go("quiz",{lid:r.lessonId,qs:qs.sort(()=>Math.random()-.5),i:0,ans:[],kind:"mastery"})}}

async function admin(){
 if(!owner){A.innerHTML='<div class="msg">هذه الصفحة للمدير فقط.</div>';return}
 let st=[];try{st=await rows("students")}catch(e){}

 h+='<div class="card"><h3>درس جديد</h3><input id="lt" placeholder="اسم الدرس (حرفيًا كما في الملزمة)"><select id="lb"><option value="">اختر الفرع</option><option value="sci">العلمي</option><option value="lit">الأدبي</option></select><textarea id="lr" rows="4" placeholder="شرح القاعدة"></textarea><input id="lm" placeholder="خلاصة «تذكّر»"><button class="btn" id="al">حفظ الدرس</button></div>';
 h+='<h3>الدروس والأسئلة</h3>';
 lessons.forEach(l=>{const n=questions.filter(q=>q.lessonId===l.id).length;h+='<div class="card"><b>'+esc(l.title)+'</b> <span class="tag">'+(BR[l.branch]||"")+'</span><span class="tag">'+(l.published?"منشور":"مسوّدة")+'</span> '+n+' سؤال<div class="row" style="margin-top:8px"><button class="btn o" data-rv="'+l.id+'">مراجعة الأسئلة</button><button class="btn o" data-pub="'+l.id+'">'+(l.published?"إيقاف":"نشر")+'</button><button class="btn o" data-del="'+l.id+'">حذف</button></div></div>'});
 if(!lessons.length)h+='<div class="card empty">أضف درسًا ثم استورد أسئلته.</div>';
 h+='<div class="card"><h3>استيراد أسئلة (JSON)</h3><select id="il">'+lessons.map(l=>'<option value="'+l.id+'">'+esc(l.title)+'</option>').join("")+'</select><textarea id="ij" rows="6" dir="ltr" placeholder=\'[{"text":"...","options":["أ","ب","ج"],"correct":0,"why":"...","level":"easy|mid|hard","skill":"..."}]\'></textarea><p style="color:var(--mut);font-size:14px">تدخل الأسئلة كمسوّدة لتراجعها قبل النشر. ضع علامة <code>"extra":true</code> للتدريبات الإضافية.</p><button class="btn" id="ia">استيراد</button> <button class="btn o" id="pa">نشر كل أسئلة الدرس</button></div>';
 h+='<h3>سجل الطلاب</h3><div class="card sc"><table><tr><th>الاسم</th><th>الفرع</th><th>آخر نشاط</th><th></th></tr>'+st.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+(BR[s.branch]||"")+'</td><td>'+new Date(s.lastActive||0).toLocaleDateString("ar")+'</td><td><button class="btn o" data-st="'+s.id+'">التفاصيل</button></td></tr>').join("")+(st.length?'':'<tr><td colspan="4" class="empty">لا طلاب بعد.</td></tr>')+'</table></div><div id="er"></div>';
 A.innerHTML=h;
 const run=async f=>{try{await f();await load();admin()}catch(e){$("#er").innerHTML='<div class="msg">'+esc(e.message||e)+'</div>'}};
 $("#al").onclick=()=>run(async()=>{const t=$("#lt").value.trim(),b=$("#lb").value;if(!t||!b)throw Error("أدخل الاسم والفرع.");await col("lessons").add({title:t,branch:b,rule:$("#lr").value,remember:$("#lm").value,published:false,order:lessons.length+1})});
 A.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>run(async()=>{const l=lessons.find(x=>x.id===b.dataset.pub);await col("lessons").doc(l.id).update({published:!l.published})}));
 A.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("حذف الدرس وأسئلته؟ لا يمكن التراجع."))run(async()=>{for(const q of questions.filter(q=>q.lessonId===b.dataset.del))await col("questions").doc(q.id).delete();await col("lessons").doc(b.dataset.del).delete()})});
 $("#ia").onclick=()=>run(async()=>{const arr=JSON.parse($("#ij").value),lid=$("#il").value;if(!lid)throw Error("اختر درسًا.");
  arr.forEach((q,i)=>{if(!q.text||!Array.isArray(q.options)||q.options.length<2||!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.options.length)throw Error("السؤال "+(i+1)+" غير صالح.");if(!LV[q.level])throw Error("السؤال "+(i+1)+": المستوى يجب easy أو mid أو hard.")});

 $("#pa").onclick=()=>run(async()=>{for(const q of questions.filter(q=>q.lessonId===$("#il").value))await col("questions").doc(q.id).update({published:true})});
 A.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>go("student",{sid:b.dataset.st}));A.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>go("review",{lid:b.dataset.rv}))}
function review(){if(!owner){A.innerHTML='<div class="msg">للمدير فقط.</div>';return}

async function importCodes(txt){let n=0;for(const t of txt.split(/\s+/)){const m=t.match(/ISBAH1:([A-Za-z0-9+\/=]+)/);if(!m)continue;const p=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
 await col("students").doc(p.id).set({name:p.n,branch:p.b,createdAt:p.c,lastActive:p.u});
 for(const x of p.att)await col("attempts/"+p.id+"/items").doc(x.i+"-"+x.k+"-"+x.r+"-"+x.a).set({lessonId:x.l,kind:x.k,round:x.r,score:x.s,total:x.t,pct:Math.round(x.s/x.t*100),sid:x.i,at:x.a,skills:x.sk});n++}return n}
